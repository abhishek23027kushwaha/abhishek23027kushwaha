<svg xmlns="http://www.w3.org/2000/svg" width="700" height="60" viewBox="0 0 700 60" role="img" aria-label="Abhishek Kumar typing animation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .line { font: 600 22px 'Courier New', monospace; fill: #36BCF7; opacity: 0; animation: cycle 15s infinite; }
    @keyframes cycle {
      0%   { opacity: 0; }
      3%   { opacity: 1; }
      17%  { opacity: 1; }
      20%  { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
  <text x="350" y="38" text-anchor="middle" class="line" style="animation-delay:0s">Hi 👋 I'm Abhishek Kumar</text>
  <text x="350" y="38" text-anchor="middle" class="line" style="animation-delay:3s">MERN Stack Developer</text>
  <text x="350" y="38" text-anchor="middle" class="line" style="animation-delay:6s">Building scalable web apps with clean code</text>
  <text x="350" y="38" text-anchor="middle" class="line" style="animation-delay:9s">Passionate about Backend, APIs &amp; Problem-Solving</text>
  <text x="350" y="38" text-anchor="middle" class="line" style="animation-delay:12s">Building projects, learning every day</text>
</svg>
